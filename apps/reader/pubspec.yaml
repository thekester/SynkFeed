name: synkfeed_reader
description: Offline-first Flutter reader for SynkFeed.
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  html: ^0.15.4
  path_provider: ^2.1.5
  synkfeed_core:
    path: ../../packages/synkfeed_core
  url_launcher: ^6.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
