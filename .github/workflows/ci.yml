name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npm run typecheck

      - name: Run server tests
        run: npm test

  core-tests:
    name: Core package tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/synkfeed_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Fetch dependencies
        run: dart pub get

      - name: Analyze core package
        run: dart analyze

      - name: Run core tests
        run: dart test

  flutter-tests:
    name: Flutter app tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/reader

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
